version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: epitrello-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - epitrello-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: epitrello-backend-dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:4000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - epitrello-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: epitrello-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_GRAPHQL_API: ${NEXT_PUBLIC_GRAPHQL_API}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - epitrello-network

  prisma-studio:
    image: node:lts-alpine3.17
    working_dir: /usr/src/app/backend
    volumes:
      - .:/usr/src/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: npx prisma studio --port 5555 --browser none
    ports:
      - "5555:5555"
    networks:
      - epitrello-network
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: epitrello-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_SERVER_JSON_FILE: /var/lib/pgadmin/servers.json
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - epitrello-network
    volumes:
      - ./configs/pgadmin/entrypoint.sh:/pgadmin-entrypoint.sh:ro
      - pgadmin_data:/var/lib/pgadmin
    entrypoint: ["/bin/sh", "/pgadmin-entrypoint.sh"]

  docs:
    build:
      context: .
      dockerfile: configs/Dockerfile.docs
    container_name: epitrello-docs-dev
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4400:4400"
    networks:
      - epitrello-network

volumes:
  pgdata:
  pgadmin_data:

networks:
  epitrello-network:
    driver: bridge
